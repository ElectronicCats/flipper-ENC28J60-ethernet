name: "FAP: Build and Release"

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'

  pull_request:

jobs:
  ufbt-build-action:
    runs-on: ubuntu-latest
    name: "ufbt: Build App"

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=Dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        env:
          EXTRA_CFLAGS: '-DFAP_APP_VERSION=\"${{ env.TAG_NAME }}\"'
        with:
          sdk-index-url: https://up.unleashedflip.com/directory.json
          sdk-channel: release
          app-dir: ./EthernetAppDemo/
      - name: Rename FAP Artifact
        id: rename-fap
        run: |
          FILES="${{ steps.build-app.outputs.fap-artifacts }}"

          RENAMED_FILES=""

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            RENAMED="${FILE%.fap}_${{ env.TAG_NAME }}.fap"

            mv "$FILE" "$RENAMED"

            RENAMED_FILES="${RENAMED_FILES}${RENAMED}"$'\n'
          done <<< "$FILES"

          {
            echo "RENAMED_FAPS<<EOF"
            echo "$RENAMED_FILES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Debug renamed files
        run: |
          echo "==== RENAMED_FAPS ===="
          printf '%s\n' "${{ env.RENAMED_FAPS }}"
          echo "======================"

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.TAG_NAME }}
          path: |
            ${{ env.RENAMED_FAPS }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}

          body_path: release-notes/${{ env.TAG_NAME }}.md

          files: |
            ${{ env.RENAMED_FAPS }}

          draft: false
          prerelease: false
          generate_release_notes: false
